<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/learning_hub.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body>
<div id="gate" class="gate-wrap">
  <div class="gate-box card">
    <h1 style="margin:0 0 10px">Learning Hub</h1>
    <p style="color:var(--soft);margin:0 0 18px">Build problem batches, export them to your iPad, and let Cowork grade your handwritten work.</p>
    <button id="google-btn" class="btn" style="width:100%;justify-content:center;padding:12px 18px;font-size:14px">Continue with Google</button>
    <div id="email-row" class="hide" style="display:flex;gap:10px;margin-top:12px">
      <input id="email" type="email" placeholder="you@example.com" style="flex:1">
      <button id="send-link" class="btn ghost">Send link</button>
    </div>
    <div id="gate-msg" class="msg"></div>
    <p style="margin:12px 0 0;font-size:12.5px"><a href="#" id="email-toggle">Use an email link instead</a></p>
    <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:14px">
      <button id="demo-btn" class="btn ghost sm">Explore with sample data</button>
    </div>
  </div>
</div>

<div id="app" class="shell hide">
  <aside class="side">
    <div class="brand"><h3>Learning Hub</h3></div>
    <a class="nav-item" href="#library" data-nav="library">Library <span class="cnt" id="cnt-lib"></span></a>
    <a class="nav-item" href="#build" data-nav="build">Build a batch <span class="cnt" id="cnt-due"></span></a>
    <a class="nav-item" href="#review" data-nav="review">Review <span class="cnt" id="cnt-fb"></span></a>
    <a class="nav-item" href="#ghost" data-nav="ghost">Ghost test</a>
    <a class="nav-item" href="#setup" data-nav="setup">Setup <span class="cnt" id="cnt-setup"></span></a>
    <div class="foot"><div id="who" class="mono" style="font-size:11px;word-break:break-all"></div><a href="#" id="signout" style="font-size:12px">Sign out</a></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="toast" class="toast"></div>
<script src="js/learning_hub.js"></script>
<script src="js/ghost_test.js"></script>
<script src="js/japanese_source.js"></script>
</body>
</html>
