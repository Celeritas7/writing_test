<!DOCTYPE html>
<html lang="en">
<!--
  Learning Hub — standalone study-loop app (separate from Commonplace Written Test).
  Plain HTML/CSS/JS + Supabase, no build step. Demo mode works out of the box (localStorage);
  fill CONFIG below to go live. Schema: see schema.sql.
-->
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#efe7d6;--paper-2:#f6f0e2;--paper-3:#fbf7ec;--ink:#211b13;--ink-soft:#564b3a;--ink-mute:#8a7c63;--rule:#cdbfa3;--rule-soft:#ddd1b8;--oxblood:#8a2f22;--oxblood-2:#6f2317;--grid-paper:#fbfaf6;--grid-line:#c9dcc9;--good:#1f8a4e;--bad:#a23b2b;--scrim:rgba(33,27,19,0.55)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"EB Garamond",Georgia,serif;color:var(--ink);background-color:var(--paper);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 16% 10%,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 38%),radial-gradient(circle at 86% 80%,rgba(160,138,96,.10) 0%,rgba(160,138,96,0) 44%)}
a{color:var(--oxblood)}a:hover{color:var(--oxblood-2)}
.wrap{max-width:1000px;margin:0 auto;padding:30px 32px 96px}
.mono{font-family:"JetBrains Mono",monospace}
.kicker{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--oxblood)}
h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(48px,8vw,72px);line-height:.9;letter-spacing:-1px;margin:10px 0 0}
.tagline{font-style:italic;font-size:19px;color:var(--ink-soft);margin:12px 0 0;max-width:52ch}
.lbl{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-mute)}
.meta{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.5px;color:var(--ink-mute)}
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:5px;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 26px -18px rgba(40,30,15,.5)}
.btn{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border-radius:4px;padding:11px 22px;cursor:pointer;background:var(--oxblood);color:#fff;border:1px solid transparent;transition:background .15s}
.btn:hover{background:var(--oxblood-2)}
.btn.ghost{background:var(--paper-3);color:var(--oxblood);border:1px solid var(--oxblood)}
.btn.ghost:hover{background:var(--paper-2)}
.btn:disabled{opacity:.5;cursor:default}
.tab{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:8px 14px;border-radius:4px;cursor:pointer;background:var(--paper-3);color:var(--ink-soft);border:1px solid var(--rule)}
.tab.on{background:var(--oxblood);color:#fff;border-color:transparent}
.badge{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--rule);color:var(--ink-mute);white-space:nowrap}
.badge.pass{color:var(--good);border-color:#1f8a4e55;background:#1f8a4e12}
.badge.fail{color:var(--bad);border-color:#a23b2b55;background:#a23b2b12}
.sec{display:flex;align-items:baseline;gap:16px;margin:44px 0 20px}
.sec .s{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;color:var(--oxblood)}
.sec h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:32px;line-height:1;letter-spacing:-.4px;margin:0;white-space:nowrap}
.sec i{flex:1;height:1px;background:var(--rule);transform:translateY(-4px)}
.seg{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.5px;border-radius:4px;padding:7px 13px;cursor:pointer;background:var(--paper-3);border:1px solid var(--rule);color:var(--ink-soft)}
.seg.on-pass{background:var(--good);color:#fff;border-color:transparent}
.seg.on-fail{background:var(--bad);color:#fff;border-color:transparent}
input,textarea{width:100%;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink);background:var(--paper-3);border:1px solid var(--rule);border-radius:4px;padding:11px 13px;outline:none}
input:focus,textarea:focus{border-color:var(--ink-mute)}
.given{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;background-color:var(--grid-paper);background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:19px 19px;border:1px solid var(--rule);border-radius:4px;padding:14px 16px}
.given b{display:block;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:#6f7d6f;margin-bottom:6px;font-weight:600}
.modal-scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 18px;z-index:50}
.modal{width:100%;max-width:720px;background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;box-shadow:0 30px 70px -20px rgba(20,12,4,.7)}
.row-h:hover{background:var(--paper-3)}
footer.colo{margin-top:64px;padding-top:22px;border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* ---------- print: the exported worksheet ---------- */
#print-root{display:none}
@media print{
  body{background:#fff}
  .wrap,.modal-scrim{display:none!important}
  #print-root{display:block}
  .pp{page-break-after:always;position:relative;min-height:9in;padding:.2in .1in;background-image:linear-gradient(#dfe8df 1px,transparent 1px),linear-gradient(90deg,#dfe8df 1px,transparent 1px);background-size:19px 19px}
  .pp .ph{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid #211b13;padding-bottom:8px;background:#fff}
  .pp .no{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:24px;color:#8a2f22}
  .pp .tt{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:26px}
  .pp .tg{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8a7c63}
  .pp .pr{font-size:17px;margin:14px 0;background:#fff;display:inline-block;padding:2px 6px}
  .pp .ans{position:absolute;left:.1in;right:.1in;bottom:.4in;background:#fff;padding-top:4px}
  .pp .ans span{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#8a7c63}
  .pp .ans i{display:block;border-bottom:1px solid #564b3a;height:26px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="print-root"></div>
<script>
/* ================= CONFIG — wire Supabase here ================= */
const CONFIG = {
  SUPABASE_URL: "",   // TODO: e.g. "https://xxxx.supabase.co"
  SUPABASE_KEY: "",   // TODO: anon key. Then: <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
  // Tables: learning_hub_problems / learning_hub_batches / learning_hub_feedback + view learning_hub_queue (schema.sql)
  FOLDER: "iCloud Drive › Commonplace Study",  // display only — pick this folder in the print dialog
};
const LIVE = !!CONFIG.SUPABASE_URL;
/* ================= demo data (replaces learning_hub_queue when not LIVE) ================= */
const TIERS = ["Warm-up", "Core", "Stretch", "Exam-level"];
const BANK = [
  { id: "apt-1", subject: "Maths", topic: "Aptitude", title: "Average speed", kind: "Drill", tier: 1, prompt: "A train covers 10, 20 and 30 km at 50, 60 and 90 km/h. Find the average speed.", given: "d = 10, 20, 30 km    v = 50, 60, 90 km/h" },
  { id: "apt-2", subject: "Maths", topic: "Aptitude", title: "Successive percentages", kind: "Drill", tier: 2, prompt: "A price rises 20% then falls 20%. Find the net percentage change.", given: "start price P, then +20%, then −20%" },
  { id: "alg-1", subject: "Maths", topic: "Algebra & Trig", title: "Quadratic roots", kind: "Worked example", tier: 2, prompt: "Solve x² − 5x + 6 = 0 by factoring, then verify with the formula.", given: "a = 1,  b = −5,  c = 6" },
  { id: "cal-1", subject: "Maths", topic: "Calculus", title: "Derivative from first principles", kind: "Proof", tier: 3, prompt: "Differentiate f(x) = x² using the limit definition.", given: "f(x) = x²,  h → 0" },
  { id: "cal-2", subject: "Maths", topic: "Calculus", title: "Definite integral", kind: "Drill", tier: 2, prompt: "Evaluate ∫₀¹ (3x² + 2x) dx.", given: "limits 0 → 1" },
  { id: "lin-1", subject: "Maths", topic: "Linear Algebra", title: "Determinant 2×2", kind: "Drill", tier: 1, prompt: "Compute det [[3,1],[4,2]] and state invertibility.", given: "A = [3 1; 4 2]" },
  { id: "pro-1", subject: "Maths", topic: "Probability", title: "Two dice", kind: "Word problem", tier: 2, prompt: "Find P(sum = 7) when two fair dice are rolled.", given: "36 equally likely outcomes" },
  { id: "sta-1", subject: "Maths", topic: "Statistics", title: "Sample variance", kind: "Drill", tier: 2, prompt: "Compute the sample variance of 2, 4, 4, 4, 5, 5, 7, 9.", given: "n = 8,  x̄ = 5" },
  { id: "jap-1", subject: "Japanese", topic: "Kanji", title: "Kanji set 12 — reading", kind: "Drill", tier: 1, prompt: "Give the on/kun readings for the 10 kanji on the sheet.", given: "set 12 · 10 kanji" },
];
/* ================= tiny store (localStorage in demo; swap for supabase queries when LIVE) ================= */
const store = {
  key: "learning_hub_demo",
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || {} } catch (e) { return {} } },
  save(d) { localStorage.setItem(this.key, JSON.stringify(d)) },
};
let db = Object.assign({ feedback: {}, batches: [], seq: 6 }, store.load());
/* feedback: {problemId: [{result, source, note, at}]}  batches: [{seq, ids, status, at}] */
function stateOf(id) {
  const h = db.feedback[id];
  if (!h || !h.length) return "new";
  const last = h[0];
  if (last.result === "fail") return "weak";
  if (Date.now() - last.at > 7 * 864e5) return "due";
  return "later";
}
function suggestBatch(n = 5) {
  const rank = { due: 0, weak: 1, new: 2, later: 3 };
  return BANK.slice().sort((a, b) => rank[stateOf(a.id)] - rank[stateOf(b.id)]).slice(0, n).map(p => p.id);
}
/* AI first pass — TODO (LIVE): call a Supabase Edge Function that sends the solved PDF to the Anthropic API
   and returns [{problem_id, result, note}]. Demo returns canned verdicts. */
function aiGrade(batch) {
  return batch.ids.map((id, i) => ({ id, result: i === 0 ? "fail" : "pass", note: i === 0 ? "Working is close but the final sign is flipped — re-check the last step." : "Correct; steps shown clearly." }));
}
/* ================= app state + render ================= */
let S = { screen: "hub", queue: suggestBatch(), modal: null, verdicts: {}, savedMsg: "" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const P = (id) => BANK.find(p => p.id === id);
function counts() {
  const c = { due: 0, weak: 0, new: 0, later: 0 };
  BANK.forEach(p => c[stateOf(p.id)]++);
  return c;
}
function badgeFor(id) {
  const st = stateOf(id);
  return st === "weak" ? '<span class="badge fail">weak spot</span>' : st === "due" ? '<span class="badge">due</span>' : st === "new" ? '<span class="badge pass">new</span>' : '<span class="badge">later</span>';
}
function render() {
  const c = counts();
  const inbox = db.batches.filter(b => b.status !== "archived");
  $("#app").innerHTML = `
  <div class="kicker">Study loop · Self-paced${LIVE ? "" : " · demo data"}</div>
  <h1>Learning Hub</h1>
  <p class="tagline">Build a batch, solve it on the iPad, grade it with the co-worker — every attempt teaches the next batch what to ask.</p>
  <nav style="display:flex;gap:8px;margin:22px 0 26px">
    ${[["hub", "Hub"], ["build", "Build a batch"], ["review", `Review inbox${inbox.filter(b => b.status === "solved" || b.status === "outbox").length ? " · " + inbox.length : ""}`]].map(([id, l]) =>
      `<button class="tab ${S.screen === id ? "on" : ""}" onclick="go('${id}')">${l}</button>`).join("")}
  </nav>
  ${S.screen === "hub" ? hubView(c) : S.screen === "build" ? buildView() : reviewView()}
  <footer class="colo">
    <span style="font-style:italic;font-size:16px;color:var(--ink-soft)">&ldquo;Every attempt teaches the next batch what to ask.&rdquo;</span>
    <span class="meta">learning hub · ${LIVE ? "supabase connected" : "demo mode — fill CONFIG to go live"}</span>
  </footer>
  ${S.modal || ""}`;
}
function sec(t) { return `<div class="sec"><span class="s">§</span><h2>${t}</h2><i></i></div>`; }
function hubView(c) {
  const tiles = [[c.due, "Due today", "spaced repetition", "var(--oxblood)"], [c.weak, "Weak spots", "last attempt failed", "var(--bad)"], [c.new, "New", "never attempted", "var(--good)"], [db.batches.filter(b => b.status === "outbox" || b.status === "solved").length, "In the loop", "batches out or awaiting grading", "#2563a8"]];
  return `${sec("Today")}
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
    ${tiles.map(([n, l, s, a]) => `<div class="card" style="border-left:4px solid ${a};padding:14px 16px">
      <div style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;line-height:1">${n}</div>
      <div class="lbl" style="color:var(--ink-soft);margin-top:6px">${l}</div><div class="meta" style="margin-top:2px">${s}</div></div>`).join("")}
  </div>
  ${sec("Ways in")}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="card" style="padding:16px 18px"><div class="lbl" style="margin-bottom:10px">By difficulty</div>
      ${TIERS.map((t, i) => { const n = BANK.filter(p => p.tier === i + 1).length; return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px"><span class="mono" style="font-size:11px;width:86px;color:var(--ink-soft)">${t}</span><span style="flex:1;height:8px;border-radius:4px;background:var(--rule-soft);overflow:hidden"><span style="display:block;height:100%;width:${n * 22}%;background:var(--oxblood);opacity:${1 - i * .18}"></span></span><span class="meta">${n}</span></div>`; }).join("")}
    </div>
    <div class="card" style="padding:16px 18px"><div class="lbl" style="margin-bottom:10px">Subjects</div>
      ${["Maths", "Japanese"].map(s => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--rule-soft)"><span style="font-size:16.5px">${s}</span><span class="meta">${BANK.filter(p => p.subject === s).length} problems</span></div>`).join("")}
      <div class="lbl" style="margin:14px 0 8px">By kind</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${["Drill", "Worked example", "Word problem", "Proof"].map(k => `<span class="badge">${k.toLowerCase()} · ${BANK.filter(p => p.kind === k).length}</span>`).join("")}</div>
    </div>
  </div>
  <div style="margin-top:26px;display:flex;align-items:center;gap:16px">
    <button class="btn" onclick="go('build')">Build today's batch →</button>
    <span style="font-style:italic;font-size:15px;color:var(--ink-soft)">Suggested: ${S.queue.length} problems — what's due and weak first, one new to keep it interesting.</span>
  </div>`;
}
function buildView() {
  return `${sec("Build a batch")}
  <p style="margin:0 0 18px;font-size:16px;color:var(--ink-soft);max-width:62ch">Suggested from your feedback — overdue first, then weak spots, then one new. Swap or remove anything before exporting.</p>
  <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start">
    <div class="card" style="overflow:hidden">
      <div class="lbl" style="padding:12px 18px;border-bottom:1px solid var(--rule)">Suggested batch · ${S.queue.length} problems</div>
      ${S.queue.map((id, i) => { const p = P(id); return `<div class="row-h" style="display:grid;grid-template-columns:34px 1fr auto auto;gap:10px;align-items:center;padding:11px 18px;${i ? "border-top:1px solid var(--rule-soft)" : ""}">
        <span class="mono" style="font-size:12px;font-weight:700;color:var(--oxblood)">№${i + 1}</span>
        <span><span style="font-size:16.5px">${esc(p.title)}</span><small class="meta" style="display:block">${p.topic} · ${p.kind} · ${TIERS[p.tier - 1]}</small></span>
        ${badgeFor(id)}
        <span style="display:flex;gap:10px" class="mono"><a href="#" onclick="swap('${id}');return false" style="text-decoration:none;font-size:11px">swap</a><a href="#" onclick="drop('${id}');return false" style="text-decoration:none;font-size:11px;color:var(--ink-mute)">×</a></span>
      </div>`; }).join("")}
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card" style="padding:16px 18px">
        <div class="lbl" style="margin-bottom:8px">Export destination</div>
        <div class="given"><b>${CONFIG.FOLDER}</b>Outbox/     ← save the PDF here
Solved/     ← finished sheets from iPad
Archive/    ← graded batches</div>
        <p class="meta" style="margin:10px 0 0">Export opens the print dialog — choose &ldquo;Save as PDF&rdquo; and pick the Outbox folder. The iPad sees it instantly.</p>
      </div>
      <button class="btn" onclick="exportBatch()">Export PDF → Outbox</button>
      <button class="btn ghost" onclick="go('hub')">← Back to hub</button>
    </div>
  </div>`;
}
function reviewView() {
  const rows = db.batches.slice().reverse();
  return `${sec("Review inbox")}
  <p style="margin:0 0 18px;font-size:16px;color:var(--ink-soft);max-width:62ch">Batches you exported. When a solved sheet lands in <b class="mono" style="font-size:14px">Solved/</b>, mark it solved here and run the grading pass — you confirm every verdict before it's saved.</p>
  ${rows.length ? rows.map(b => `<div class="card" style="display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:13px 18px;margin-bottom:12px">
    <span><span class="mono" style="font-size:13px">${b.name}</span><small class="meta" style="display:block">${b.ids.length} problems · exported ${new Date(b.at).toLocaleDateString()}</small></span>
    <span class="badge ${b.status === "graded" ? "pass" : ""}">${{ outbox: "awaiting iPad", solved: "ready to grade", graded: "feedback saved" }[b.status] || b.status}</span>
    ${b.status === "outbox" ? `<button class="btn ghost" style="padding:8px 14px" onclick="markSolved(${b.seq})">Mark solved →</button>`
      : b.status === "solved" ? `<button class="btn" style="padding:8px 14px" onclick="openGrade(${b.seq})">Grade →</button>`
      : `<span class="meta">done</span>`}
  </div>`).join("") : `<p style="font-style:italic;color:var(--ink-mute)">Nothing here yet — export a batch first.</p>`}`;
}
/* ---------- grading modal ---------- */
function openGrade(seq) {
  const b = db.batches.find(x => x.seq === seq);
  const ai = aiGrade(b); S.verdicts = {}; S.savedMsg = "";
  S.modal = gradeModal(b, ai); S._ai = ai; S._batch = b; render();
}
function gradeModal(b, ai) {
  return `<div class="modal-scrim" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div style="padding:22px 26px 16px;border-bottom:1px solid var(--rule);position:relative">
      <div class="kicker" style="letter-spacing:2px;margin-bottom:6px">Solved sheet · ${b.name}</div>
      <h3 style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;line-height:1.05;margin:0">Confirm the grading</h3>
      <button onclick="closeModal()" aria-label="Close" style="position:absolute;top:18px;right:20px;background:none;border:none;font-size:22px;color:var(--ink-mute);cursor:pointer">&times;</button>
    </div>
    <div style="padding:8px 26px 26px">
      ${ai.map(v => { const p = P(v.id); return `<div style="border-bottom:1px solid var(--rule-soft);padding:14px 0">
        <div style="display:flex;gap:10px;align-items:baseline;margin-bottom:6px"><span style="font-size:17px">${esc(p.title)}</span><span class="meta">${p.topic}</span><span class="badge ${v.result === "pass" ? "pass" : "fail"}">AI: ${v.result === "pass" ? "correct" : "wrong"}</span></div>
        <p style="font-style:italic;font-size:14.5px;color:var(--ink-soft);margin:0 0 10px">&ldquo;${esc(v.note)}&rdquo;</p>
        <div style="display:flex;gap:8px">
          <button class="seg ${S.verdicts[v.id] === "confirm" ? (v.result === "pass" ? "on-pass" : "on-fail") : ""}" onclick="verdict('${v.id}','confirm')">Confirm</button>
          <button class="seg ${S.verdicts[v.id] === "override" ? (v.result === "pass" ? "on-fail" : "on-pass") : ""}" onclick="verdict('${v.id}','override')">Override → ${v.result === "pass" ? "wrong" : "correct"}</button>
        </div></div>`; }).join("")}
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:22px">
        <span class="mono" style="font-size:12px;letter-spacing:1px;color:${S.savedMsg ? "var(--good)" : "var(--ink-mute)"}">${S.savedMsg || Object.keys(S.verdicts).length + "/" + ai.length + " confirmed"}</span>
        <button class="btn" ${S.savedMsg ? "disabled" : ""} onclick="saveFeedback()">Save feedback${LIVE ? " → Supabase" : ""}</button>
      </div>
    </div></div></div>`;
}
/* ---------- actions ---------- */
function go(s) { S.screen = s; S.modal = null; render(); }
function swap(id) { const pool = BANK.filter(p => !S.queue.includes(p.id)); if (pool.length) S.queue = S.queue.map(x => x === id ? pool[0].id : x); render(); }
function drop(id) { S.queue = S.queue.filter(x => x !== id); render(); }
function exportBatch() {
  db.seq++;
  const name = `${new Date().toISOString().slice(0, 10)} · Batch ${String(db.seq).padStart(2, "0")}.pdf`;
  const b = { seq: db.seq, name, ids: S.queue.slice(), status: "outbox", at: Date.now() };
  db.batches.push(b); store.save(db);
  // TODO (LIVE): insert into learning_hub_batches
  $("#print-root").innerHTML = b.ids.map((id, i) => { const p = P(id); return `<div class="pp">
    <div class="ph"><span class="no">${String(i + 1).padStart(2, "0")}</span><span class="tt">${esc(p.title)}</span><span class="tg">${p.topic} · ${TIERS[p.tier - 1]} · ${name.replace(".pdf", "")}</span></div>
    <p class="pr">${esc(p.prompt)}</p>
    ${p.given ? `<div class="given" style="display:inline-block;background-image:none;background:#fff"><b>Given / Data</b>${esc(p.given)}</div>` : ""}
    <div class="ans"><span>Answer</span><i></i><i></i></div>
  </div>`; }).join("");
  render(); window.print();
}
function markSolved(seq) { const b = db.batches.find(x => x.seq === seq); b.status = "solved"; store.save(db); render(); }
function verdict(id, v) { S.verdicts[id] = v; S.modal = gradeModal(S._batch, S._ai); render(); }
function closeModal() { S.modal = null; render(); }
function saveFeedback() {
  S._ai.forEach(v => {
    const conf = S.verdicts[v.id] || "confirm";
    const result = conf === "confirm" ? v.result : (v.result === "pass" ? "fail" : "pass");
    (db.feedback[v.id] = db.feedback[v.id] || []).unshift({ result, source: conf === "confirm" ? "ai_confirmed" : "ai_overridden", note: v.note, at: Date.now() });
  });
  S._batch.status = "graded"; store.save(db);
  // TODO (LIVE): insert rows into learning_hub_feedback + update learning_hub_batches.status
  S.queue = suggestBatch();
  S.savedMsg = "Feedback saved ✓ — next batch updated";
  S.modal = gradeModal(S._batch, S._ai); render();
}
render();
</script>
</body></html>
